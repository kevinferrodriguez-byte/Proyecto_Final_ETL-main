* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; }
:focus-visible { outline: 2px solid var(--observed); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: var(--navy-text); padding: 28px 18px; display: flex; flex-direction: column; gap: 28px;
        position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand h2 { color: var(--navy-strong); font-size: 20px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.brand p { margin-top: 8px; font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 8px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
              border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--navy-strong); cursor: pointer; font-size: 14px; }
.nav button:hover { background: var(--navy-hover); }
.nav button[aria-current="page"] { background: #2A78D6; border-color: #2A78D6; font-weight: 600; }
.nav .ico { width: 18px; text-align: center; opacity: .9; }
.side-foot { margin-top: auto; font-size: 12px; display: flex; flex-direction: column; gap: 10px; }
.side-foot b { color: var(--navy-strong); }

.main { min-width: 0; padding-inline: 28px; padding-block: 24px 32px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
.head-title { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.head-title h1 { font-size: 30px; font-weight: 700; color: var(--brand); letter-spacing: -.01em; text-wrap: balance; }
.head-title p { color: var(--text2); font-size: 15px; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.periodo { display: flex; flex-direction: column; gap: 8px; min-width: 240px; }
.periodo .lbl, .eyebrow { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; }
.periodo .row { display: flex; gap: 8px; align-items: center; }
.periodo select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
.hasta { display: flex; align-items: center; gap: 14px; }
.hasta .n { font-size: 24px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.ico-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--icon-bg); color: var(--observed); display: grid; place-items: center; font-size: 18px; flex: none; }

.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.g-esc { display: grid; grid-template-columns: 240px minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.g-wide { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.g-res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 16px; }
td.nw { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.kpi { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.kpi .lbl { font-size: 13px; font-weight: 600; color: var(--text); }
.kpi .val { font-size: 30px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .delta { font-size: 13px; font-weight: 600; }
.kpi .sub { font-size: 12px; color: var(--text2); }
.up-bad, .down-bad { color: var(--bad); } .up-good, .down-good { color: var(--good); } .flat { color: var(--text2); }
.spark { width: 100%; height: 30px; display: block; }

.panel { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text); text-wrap: balance; }
.panel .sub { font-size: 12.5px; color: var(--text2); }
.chart { position: relative; height: 270px; margin-top: 6px; }
.chart.tall { height: 380px; }
.chart.short { height: 220px; }

.banner { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 12px; padding: 12px 16px; font-size: 13.5px; }
.banner b { color: var(--warning); }
.insights { background: var(--insight-bg); border: 1px solid var(--insight-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.insights-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.insights-head h3 { font-size: 16px; color: var(--brand); }
.insights-head span { font-size: 12.5px; color: var(--text2); }
.ins { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; border-left: 4px solid var(--observed); font-size: 14px; min-width: 0; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--text2); background: var(--bg); padding: 8px 10px; white-space: nowrap; }
td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; }
td svg { display: block; }

.radio { display: flex; flex-direction: column; gap: 8px; }
.radio label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.lectura { font-size: 13px; color: var(--text2); }
.lectura b { color: var(--text); }
ul.lim { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
details summary { cursor: pointer; color: var(--observed); font-weight: 600; }
details p { margin-top: 6px; font-size: 12.5px; color: var(--text2); word-break: break-word; }

.hallazgos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.hz { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hz .tag { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--icon-bg); color: var(--brand); }
.hz p { font-size: 16px; font-weight: 500; line-height: 1.4; text-wrap: pretty; }
.hz button { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--observed); font-weight: 600; cursor: pointer; }
.hz button:hover { text-decoration: underline; }

.foot { font-size: 12px; color: var(--text2); border-top: 1px solid var(--border); padding-top: 12px; }

@media (max-width: 1180px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-res { grid-template-columns: minmax(0, 1fr); }
  .g-esc { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .g-esc > :first-child { grid-column: span 2; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 18px 16px; gap: 14px; }
  .brand p, .side-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .nav button { width: auto; white-space: nowrap; flex: none; }
  .main { padding-inline: 16px; }
  .g2, .g3, .g-wide, .hallazgos, .g-esc { grid-template-columns: minmax(0, 1fr); }
  .g-esc > :first-child { grid-column: auto; }
}
@media (max-width: 480px) { .g4 { grid-template-columns: minmax(0, 1fr); } .head-title h1 { font-size: 24px; } }
</style>

// ── Acceso a series ───────────────────────────────────────────────────────

}
const esProv = (col, y) => (PROV[col] || []).includes(y);

// ── Títulos dinámicos (equivalentes a las medidas DAX «Título · …») ───────
const T = {
  dependencia(r) {
    const e = extremos("tasa_dependencia_mayores", r); if (e.a0 == null) return "Sin datos en el periodo";
    const x = e.v1 / e.v0;
    const verbo = x >= 1.9 && x < 2.1 ? "prácticamente se duplicó" : x >= 2.1 ? `se multiplicó por ${fmt(x, 1)}` : x > 1 ? "aumentó" : "disminuyó";
    return `La dependencia de mayores ${verbo}: de ${fmt(e.v0, 1)} % (${e.a0}) a ${fmt(e.v1, 1)} % (${e.a1})`;
  },
  estructura(r) {
    const ys = anyosCon(["poblacion_65_mas"], r).filter(y => valor("poblacion_menores_16", y) != null);
    if (!ys.length) return "Sin datos en el periodo";
    const mas = y => valor("poblacion_65_mas", y) > valor("poblacion_menores_16", y);
    let cruce = null;
    ys.forEach((y, i) => { if (i > 0 && mas(y) && !mas(ys[i - 1])) cruce = y; });
    if (cruce && ys.slice(ys.indexOf(cruce)).every(mas)) return `Desde ${cruce} hay más personas de 65+ que menores de 16`;
    return ys.every(mas) ? "En todo el periodo hay más personas de 65+ que menores de 16" : "Composición de la población por grupo de edad";
  },
  fecundidad(r) {
    const e = extremos("indicador_coyuntural_fecundidad", r); if (e.a1 == null) return "Sin datos en el periodo";
    const min = Math.min(...e.s.ys);
    return `${e.v1 <= min ? "La fecundidad marca su mínimo del periodo: " : "Fecundidad: "}${fmt(e.v1, 2)} hijos por mujer en ${e.a1}${e.v1 < 2.1 ? ", por debajo del reemplazo (2,1)" : ""}`;
  },
  vegetativo(r) {
    const e = extremos("saldo_vegetativo", r); if (e.a1 == null) return "Sin datos en el periodo";
    if (e.v1 >= 0) return `Saldo vegetativo positivo en ${e.a1}`;
    const pos = e.s.xs.filter((y, i) => e.s.ys[i] > 0);
    return pos.length ? `Saldo vegetativo negativo desde ${pos[pos.length - 1] + 1}: mueren más personas de las que nacen` : "Saldo vegetativo negativo en todo el periodo";
  },
  migratorio(r) {

  },
  indice(r) {
    const e = extremos("total_pensiones", r); if (e.a0 == null) return "Sin datos de pensiones en el periodo";
    const ga = valor("total_afiliados", e.a1) / valor("total_afiliados", e.a0) - 1, gp = e.v1 / e.v0 - 1;
    return `Desde ${e.a0}, los afiliados ${ga > gp ? "crecen más que" : "no crecen más que"} las pensiones: ${pct(ga)} frente a ${pct(gp)} (${e.a1})`;
  },
  ratio(r) {
    const e = extremos("ratio_cotizantes_pensionistas", r); if (e.a0 == null) return "Sin datos en el periodo";
    return `Afiliados por pensión: de ${fmt(e.v0, 2)} (${e.a0}) a ${fmt(e.v1, 2)} (${e.a1})`;
  },
  afiliacion(r) {
    const e = extremos("tasa_afiliacion_16_64", r); if (e.a1 == null) return "Sin datos en el periodo";
    const max = Math.max(...e.s.ys);

  },
  ev65(r) {

    const ys = Object.keys(m).map(Number).filter(y => h[y] != null && y >= r.desde && y <= r.hasta);
    if (!ys.length) return "Sin datos en el periodo";
    const y = Math.max(...ys);
    return `A los 65 años, las mujeres viven en promedio ${fmt(m[y] - h[y], 1)} años más que los hombres (${y})`;
  },
  gasto(r) {

    const max = Math.max(...e.s.ys), amax = e.s.xs[e.s.ys.indexOf(max)];
    const extra = amax !== e.a1 && amax !== e.a0 ? `; máximo de ${fmt(max, 1)} % en ${amax}` : "";
    return `El gasto en pensiones pasó del ${fmt(e.v0, 1)} % del PIB (${e.a0}) al ${fmt(e.v1, 1)} % (${e.a1}${esProv("gasto_pensiones_pib", e.a1) ? ", provisional" : ""})${extra}`;
  },
  indiceFin(r) {
    const e = extremos("gasto_pensiones_pib", r); if (e.a0 == null) return "Sin datos en el periodo";
    const gg = valor("gasto_pensiones", e.a1) / valor("gasto_pensiones", e.a0) - 1, gpib = valor("pib", e.a1) / valor("pib", e.a0) - 1;
    return `Desde ${e.a0}, el gasto en pensiones creció ${pct(gg)} y el PIB ${pct(gpib)} (${e.a1})`;
  },
  dispersion(r) {
    const ys = anyosCon(["gasto_pensiones_pib"], r).filter(y => valor("tasa_dependencia_mayores", y) != null);
    if (ys.length < 3) return "Datos insuficientes en el periodo";
    const c = pearson(ys.map(y => valor("tasa_dependencia_mayores", y)), ys.map(y => valor("gasto_pensiones_pib", y)));
    return `${c > 0.5 ? "Más dependencia de mayores, más gasto/PIB" : "Relación débil entre dependencia y gasto/PIB"}: r = ${fmt(c, 2)} (${ys[0]}–${ys[ys.length - 1]})`;
  },

function pearson(a, b) {
  const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;

  return sab / Math.sqrt(saa * sbb);

function ultimo(col) {

}
function variacion(spec) {

  const d = spec.modo === "pct" ? u.v / prev - 1 : (u.v - prev) * k;
  const texto = spec.modo === "pct" ? pct(d, 1) : spec.modo === "pp" ? firmado(d, 1) + " pp" : firmado(d, spec.d);
  const flecha = d > 0 ? "▲" : d < 0 ? "▼" : "■";
  let lectura = "", clase = "flat";

    lectura = malo ? "desfavorable" : "favorable"; clase = malo ? "up-bad" : "up-good";

  return { u, prev, d, texto: `${flecha} ${texto} vs ${u.y - 1}`, clase, lectura };

function sparkSVG(col, n = 15) {
  const s = serie(col); const xs = s.xs.slice(-n), ys = s.ys.slice(-n);
  if (ys.length < 2) return "";

  const px = i => (i / (ys.length - 1)) * (w - 2 * pad) + pad, py = v => max === min ? h / 2 : h - pad - (v - min) / (max - min) * (h - 2 * pad);
  const pts = ys.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area = `${pad},${h} ${pts} ${(w - pad).toFixed(1)},${h}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Tendencia ${xs[0]}–${xs[xs.length - 1]}">
    <polygon points="${area}" fill="var(--observed)" opacity=".12"></polygon>
    <polyline points="${pts}" fill="none" stroke="var(--observed)" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>

      <td><details><summary>${esc((x.detalle || "").slice(0, 70))}${(x.detalle || "").length > 70 ? "…" : ""}</summary><p>${esc(x.detalle)}</p></details></td></tr>`).join("") || `<tr><td colspan="4">Sin advertencias ni fallas.</td></tr>`;
  const dicc = D.indicadores.filter(i => i.tipo_indicador !== "metrica_base").sort((a, b) => (a.codigo_kpi || "Z").localeCompare(b.codigo_kpi || "Z")).map(i =>
    `<tr><td>${i.codigo_kpi || "Contexto"}</td><td>${esc(i.nombre_indicador)}</td><td>${esc(i.formula)}</td><td>${esc(UNIDAD[i.unidad] || "personas")}</td><td>${esc(FUENTE[i.codigo_fuente] || i.codigo_fuente)}</td><td class="num">${i.cobertura_desde ?? ""}–${i.cobertura_hasta ?? ""}</td></tr>`).join("");
  const html = `<div class="g4">${tarjetaQ("Reglas de calidad evaluadas", R.length, "▦", "var(--brand)")}${tarjetaQ("Reglas superadas", cuenta("cumple"), "✓", "var(--good)")}
      ${tarjetaQ("Advertencias", cuenta("advertencia"), "!", "var(--warning)")}${tarjetaQ("Fallas", cuenta("falla"), "✕", "var(--bad)")}</div>
    <div class="g-wide">${panel("capas", `${cuenta("cumple")} de ${R.length} reglas superadas; ${cuenta("falla")} fallas en la última ejecución`, "Última ejecución de cada capa del pipeline · una falla impide escribir la capa")}

        <div class="tbl-wrap"><table><tr><th>KPI</th><th>Indicador</th><th>Fórmula</th><th>Unidad</th><th>Fuente</th><th style="text-align:right">Cobertura</th></tr>${dicc}</table></div></div>

        <li>KPI-07 se mide por pensión, no por pensionista; pensiones disponibles desde 2016.</li>
        <li>Ruptura del saldo migratorio en 2021.</li><li>PIB y gasto/PIB recientes son provisionales y revisables.</li>
        <li>Solo España: sin datos por comunidad autónoma.</li><li>Los escenarios del INE son demográficos, no fiscales.</li>

  document.getElementById("periodo").hidden = !p.periodo;
  selDesde.value = S.desde; selHasta.value = S.hasta;
  const [html, dibujar] = PAG[p.id]();
  document.getElementById("pagina").innerHTML = html;
  dibujar();
}
if (window.Chart) Chart.register(etiquetas);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (PAGINAS.some(p => p.id === h) && h !== S.pagina) { S.pagina = h; render(); } });
render();
})();
</script>
