:root {

  --warn-bg: #FFF8E6; --warn-border: #F2DFAE; --insight-bg: #EEF4FB; --insight-border: #D6E4F5; --icon-bg: #EAF1FB;

    --navy: #091D33; --navy-text: #B7C6D8; --navy-hover: #143457; --navy-strong: #FFFFFF;
    --brand: #8DB8EE; --observed: #5B9BEA; --compare: #F08A5D; --third: #3CC891; --reference: #7D8794;
    --good: #3FB950; --bad: #F85149; --warning: #D7A22A;
    --warn-bg: #2A2312; --warn-border: #5A4920; --insight-bg: #14233A; --insight-border: #22385A; --icon-bg: #1A2C45;
    --tooltip-bg: #E6EAF0; --tooltip-text: #0E1319;

}

  --text: #E6EAF0; --text2: #A6B0BC; --muted: #7D8794;

.hz p { font-size: 16px; font-weight: 500; line-height: 1.4; text-wrap: pretty; }
.hz button { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--observed); font-weight: 600; cursor: pointer; }

@media (max-width: 1180px) {

@media (max-width: 480px) { .g4 { grid-template-columns: minmax(0, 1fr); } .head-title h1 { font-size: 24px; } }

<script type="application/json" id="datos">__DATOS__</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("datos").textContent);
const P = D.panel, YEARS = P.anyo, PRIMERO = YEARS[0], ULTIMO = YEARS[YEARS.length - 1];
const PROV = D.provisional || {};
const REDUCIR = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── Formato numérico (es-ES) ──────────────────────────────────────────────
const cacheNF = {};
const nf = d => cacheNF[d] || (cacheNF[d] = new Intl.NumberFormat("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always" }));
const fmt = (v, d = 1) => (v == null || Number.isNaN(v)) ? "—" : nf(d).format(v);
const firmado = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), d);
const pct = (g, d = 0) => firmado(g * 100, d) + " %";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ── Estado ────────────────────────────────────────────────────────────────
const PAGINAS = [
  { id: "resumen", nombre: "Resumen ejecutivo", ico: "⌂", titulo: "Resumen ejecutivo", pregunta: "Riesgo demográfico y sostenibilidad del sistema público de pensiones en España", periodo: false },
  { id: "demografia", nombre: "Presión demográfica", ico: "◔", titulo: "Presión demográfica", pregunta: "¿Por qué hay cada vez más personas mayores por cada persona en edad de trabajar?", periodo: true },
  { id: "contributivo", nombre: "Equilibrio contributivo", ico: "⇄", titulo: "Equilibrio contributivo", pregunta: "¿Crecen más los afiliados que cotizan o las pensiones que se pagan?", periodo: true },
  { id: "financiero", nombre: "Esfuerzo financiero", ico: "€", titulo: "Esfuerzo financiero", pregunta: "¿Cuánto pesa el gasto en pensiones en la economía y cómo ha evolucionado?", periodo: true },
  { id: "escenarios", nombre: "Horizonte 2050", ico: "↗", titulo: "Horizonte 2050", pregunta: "¿Qué rango de presión demográfica proyectan los escenarios oficiales del INE?", periodo: false },
  { id: "metodologia", nombre: "Metodología y calidad", ico: "☰", titulo: "Metodología y calidad del dato", pregunta: "¿Cómo se calcula cada indicador y cuán fiable es el dato?", periodo: false },
  { id: "hallazgos", nombre: "Hallazgos clave", ico: "★", titulo: "Hallazgos clave", pregunta: "¿Qué debe recordar quien lee este tablero?", periodo: false },
];
const S = { pagina: "resumen", desde: PRIMERO, hasta: ULTIMO, ind: "tasa_dependencia_mayores" };
try { Object.assign(S, JSON.parse(localStorage.getItem("pensiones-estado") || "{}")); } catch (e) {}
const hash = location.hash.replace("#", "");
if (PAGINAS.some(p => p.id === hash)) S.pagina = hash;
if (!PAGINAS.some(p => p.id === S.pagina)) S.pagina = "resumen";
const guardar = () => { try { localStorage.setItem("pensiones-estado", JSON.stringify(S)); } catch (e) {} };

const TODO = { desde: PRIMERO, hasta: ULTIMO };
const rango = () => PAGINAS.find(p => p.id === S.pagina).periodo ? { desde: S.desde, hasta: S.hasta } : TODO;

// ── Acceso a series ───────────────────────────────────────────────────────
const valor = (col, y) => { const i = YEARS.indexOf(y); return i < 0 ? null : P[col][i]; };
function serie(col, r = TODO, k = 1) {
  const xs = [], ys = [];
  YEARS.forEach((y, i) => { const v = P[col][i]; if (y >= r.desde && y <= r.hasta && v != null) { xs.push(y); ys.push(v * k); } });
  return { xs, ys };
}
function extremos(col, r = TODO) {
  const s = serie(col, r);
  return { a0: s.xs[0], v0: s.ys[0], a1: s.xs[s.xs.length - 1], v1: s.ys[s.ys.length - 1], s };
}
const esProv = (col, y) => (PROV[col] || []).includes(y);
function anyosCon(cols, r) {
  return YEARS.filter(y => y >= r.desde && y <= r.hasta && cols.some(c => valor(c, y) != null));
}

// ── Títulos dinámicos (equivalentes a las medidas DAX «Título · …») ───────
const T = {
  dependencia(r) {
    const e = extremos("tasa_dependencia_mayores", r); if (e.a0 == null) return "Sin datos en el periodo";
    const x = e.v1 / e.v0;
    const verbo = x >= 1.9 && x < 2.1 ? "prácticamente se duplicó" : x >= 2.1 ? `se multiplicó por ${fmt(x, 1)}` : x > 1 ? "aumentó" : "disminuyó";
    return `La dependencia de mayores ${verbo}: de ${fmt(e.v0, 1)} % (${e.a0}) a ${fmt(e.v1, 1)} % (${e.a1})`;
  },
  estructura(r) {
    const ys = anyosCon(["poblacion_65_mas"], r).filter(y => valor("poblacion_menores_16", y) != null);
    if (!ys.length) return "Sin datos en el periodo";
    const mas = y => valor("poblacion_65_mas", y) > valor("poblacion_menores_16", y);
    let cruce = null;
    ys.forEach((y, i) => { if (i > 0 && mas(y) && !mas(ys[i - 1])) cruce = y; });
    if (cruce && ys.slice(ys.indexOf(cruce)).every(mas)) return `Desde ${cruce} hay más personas de 65+ que menores de 16`;
    return ys.every(mas) ? "En todo el periodo hay más personas de 65+ que menores de 16" : "Composición de la población por grupo de edad";
  },
  fecundidad(r) {
    const e = extremos("indicador_coyuntural_fecundidad", r); if (e.a1 == null) return "Sin datos en el periodo";
    const min = Math.min(...e.s.ys);
    return `${e.v1 <= min ? "La fecundidad marca su mínimo del periodo: " : "Fecundidad: "}${fmt(e.v1, 2)} hijos por mujer en ${e.a1}${e.v1 < 2.1 ? ", por debajo del reemplazo (2,1)" : ""}`;
  },
  vegetativo(r) {
    const e = extremos("saldo_vegetativo", r); if (e.a1 == null) return "Sin datos en el periodo";
    if (e.v1 >= 0) return `Saldo vegetativo positivo en ${e.a1}`;
    const pos = e.s.xs.filter((y, i) => e.s.ys[i] > 0);
    return pos.length ? `Saldo vegetativo negativo desde ${pos[pos.length - 1] + 1}: mueren más personas de las que nacen` : "Saldo vegetativo negativo en todo el periodo";
  },
  migratorio(r) {
    const e = extremos("saldo_migratorio_exterior", r); if (e.a1 == null) return "Sin datos en el periodo";
    return `Saldo migratorio con el extranjero: ${firmado(e.v1, 0)} personas en ${e.a1}`;
  },
  indice(r) {
    const e = extremos("total_pensiones", r); if (e.a0 == null) return "Sin datos de pensiones en el periodo";
    const ga = valor("total_afiliados", e.a1) / valor("total_afiliados", e.a0) - 1, gp = e.v1 / e.v0 - 1;
    return `Desde ${e.a0}, los afiliados ${ga > gp ? "crecen más que" : "no crecen más que"} las pensiones: ${pct(ga)} frente a ${pct(gp)} (${e.a1})`;
  },
  ratio(r) {
    const e = extremos("ratio_cotizantes_pensionistas", r); if (e.a0 == null) return "Sin datos en el periodo";
    return `Afiliados por pensión: de ${fmt(e.v0, 2)} (${e.a0}) a ${fmt(e.v1, 2)} (${e.a1})`;
  },
  afiliacion(r) {
    const e = extremos("tasa_afiliacion_16_64", r); if (e.a1 == null) return "Sin datos en el periodo";
    const max = Math.max(...e.s.ys);
    return `${fmt(e.v1, 1)} afiliados por cada 100 personas de 16-64 años en ${e.a1}${e.v1 >= max ? ": máximo del periodo" : ""}`;
  },
  ev65(r) {
    const h = D.esperanza65.hombres || {}, m = D.esperanza65.mujeres || {};
    const ys = Object.keys(m).map(Number).filter(y => h[y] != null && y >= r.desde && y <= r.hasta);
    if (!ys.length) return "Sin datos en el periodo";
    const y = Math.max(...ys);
    return `A los 65 años, las mujeres viven en promedio ${fmt(m[y] - h[y], 1)} años más que los hombres (${y})`;
  },
  gasto(r) {
    const e = extremos("gasto_pensiones_pib", r); if (e.a0 == null) return "Sin datos en el periodo";
    const max = Math.max(...e.s.ys), amax = e.s.xs[e.s.ys.indexOf(max)];
    const extra = amax !== e.a1 && amax !== e.a0 ? `; máximo de ${fmt(max, 1)} % en ${amax}` : "";
    return `El gasto en pensiones pasó del ${fmt(e.v0, 1)} % del PIB (${e.a0}) al ${fmt(e.v1, 1)} % (${e.a1}${esProv("gasto_pensiones_pib", e.a1) ? ", provisional" : ""})${extra}`;
  },
  indiceFin(r) {
    const e = extremos("gasto_pensiones_pib", r); if (e.a0 == null) return "Sin datos en el periodo";
    const gg = valor("gasto_pensiones", e.a1) / valor("gasto_pensiones", e.a0) - 1, gpib = valor("pib", e.a1) / valor("pib", e.a0) - 1;
    return `Desde ${e.a0}, el gasto en pensiones creció ${pct(gg)} y el PIB ${pct(gpib)} (${e.a1})`;
  },
  dispersion(r) {
    const ys = anyosCon(["gasto_pensiones_pib"], r).filter(y => valor("tasa_dependencia_mayores", y) != null);
    if (ys.length < 3) return "Datos insuficientes en el periodo";
    const c = pearson(ys.map(y => valor("tasa_dependencia_mayores", y)), ys.map(y => valor("gasto_pensiones_pib", y)));
    return `${c > 0.5 ? "Más dependencia de mayores, más gasto/PIB" : "Relación débil entre dependencia y gasto/PIB"}: r = ${fmt(c, 2)} (${ys[0]}–${ys[ys.length - 1]})`;
  },
  media(r) {

function ultimo(col) {
  for (let i = YEARS.length - 1; i >= 0; i--) if (P[col][i] != null) return { y: YEARS[i], v: P[col][i] };
  return { y: null, v: null };
}
function variacion(spec) {

  if (u.v == null || prev == null) return { u, texto: "Sin año anterior", clase: "flat", lectura: "" };
  const d = spec.modo === "pct" ? u.v / prev - 1 : (u.v - prev) * k;
  const texto = spec.modo === "pct" ? pct(d, 1) : spec.modo === "pp" ? firmado(d, 1) + " pp" : firmado(d, spec.d);
  const flecha = d > 0 ? "▲" : d < 0 ? "▼" : "■";
  let lectura = "", clase = "flat";
  if (spec.sentido !== "neutro" && d !== 0) {

    lectura = malo ? "desfavorable" : "favorable"; clase = malo ? "up-bad" : "up-good";

  return { u, prev, d, texto: `${flecha} ${texto} vs ${u.y - 1}`, clase, lectura };
}
function sparkSVG(col, n = 15) {
  const s = serie(col); const xs = s.xs.slice(-n), ys = s.ys.slice(-n);
  if (ys.length < 2) return "";
  const min = Math.min(...ys), max = Math.max(...ys), w = 100, h = 28, pad = 3;
  const px = i => (i / (ys.length - 1)) * (w - 2 * pad) + pad, py = v => max === min ? h / 2 : h - pad - (v - min) / (max - min) * (h - 2 * pad);
  const pts = ys.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area = `${pad},${h} ${pts} ${(w - pad).toFixed(1)},${h}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Tendencia ${xs[0]}–${xs[xs.length - 1]}">
    <polygon points="${area}" fill="var(--observed)" opacity=".12"></polygon>
    <polyline points="${pts}" fill="none" stroke="var(--observed)" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>
    <circle cx="${px(ys.length - 1).toFixed(1)}" cy="${py(ys[ys.length - 1]).toFixed(1)}" r="2.2" fill="var(--observed)"></circle></svg>`;
}
function tarjeta(clave) {
  const sp = TARJETAS[clave], v = variacion(sp), k = sp.k || 1, prov = esProv(sp.col, v.u.y);
  const sufijo = sp.lbl.includes("(%") ? " %" : "";
  return `<div class="box kpi">
    <div class="kpi-top"><span class="lbl">${esc(sp.lbl)}</span><span class="ico-circle" aria-hidden="true">${sp.ico}</span></div>
    <div class="val">${fmt(v.u.v * k, sp.d)}${sufijo}${prov ? ' <span style="font-size:14px;color:var(--text2)">(p)</span>' : ""}</div>
    <div class="delta ${v.clase}">${esc(v.texto)}${v.lectura ? ` · ${v.lectura}` : ""}</div>
    <div class="sub">Dato ${v.u.y}${prov ? " provisional" : ""} · ${esc(sp.fuente)}</div>
    ${sparkSVG(sp.col)}
  </div>`;
}

function linea(label, data, color, { dash = [], ancho = 2.5, relleno = false, anyos = [], col = null, sinTooltip = false } = {}) {

      const pts = ys.filter(y => valor("tasa_dependencia_mayores", y) != null).map(y => ({ x: valor("tasa_dependencia_mayores", y), y: valor("gasto_pensiones_pib", y), anyo: y }));
      crear("dispersion", { type: "scatter", data: { datasets: [{ label: "Años", data: pts, backgroundColor: hexA(tk("observed"), .75), borderColor: tk("observed"), pointRadius: 4, pointHoverRadius: 6 }] },
        options: opciones({ leyenda: false, extra: {
          interaction: { mode: "nearest", intersect: true },
          plugins: { legend: { display: false }, tooltip: { backgroundColor: tk("tooltip-bg"), titleColor: tk("tooltip-text"), bodyColor: tk("tooltip-text"), padding: 10,
            callbacks: { title: c => String(c[0].raw.anyo), label: c => ` Dependencia ${fmt(c.raw.x, 1)} % · gasto ${fmt(c.raw.y, 1)} % del PIB` } } },
          scales: { x: { type: "linear", title: { display: true, text: "Dependencia de mayores (%)", color: tk("text2") }, grid: { color: tk("grid") }, border: { color: tk("border") }, ticks: { color: tk("text2"), callback: v => fmt(v, 0) } },
                    y: { title: { display: true, text: "Gasto en pensiones (% PIB)", color: tk("text2") }, grid: { color: tk("grid") }, border: { display: false }, ticks: { color: tk("text2"), callback: v => fmt(v, 0) } } } } }) });
    }
    const sm = serie("pension_media_mensual", r);
    crear("media", { type: "line", data: { labels: sm.xs, datasets: [linea("Pensión media (€/mes)", sm.ys, tk("observed"))] },
      options: opciones({ leyenda: false, tooltip: v => fmt(v, 2) + " €", ytick: v => fmt(v, 0) + " €" }) });
  };
  return [html, dibujar];
};

const IND_ESC = { tasa_dependencia_mayores: ["Dependencia de mayores (%)", 1, " %"], indice_envejecimiento: ["Índice de envejecimiento", 1, ""],
  porcentaje_mayores_65: ["% población 65+", 1, " %"], tasa_dependencia: ["Tasa de dependencia total (%)", 1, " %"] };
const ROL = { base: "base", optimista: "optimista", pesimista: "pesimista" };
PAG.escenarios = () => {
  if (!IND_ESC[S.ind]) S.ind = "tasa_dependencia_mayores";
  const [nombre, d, suf] = IND_ESC[S.ind];
  const pr = D.proyecciones[S.ind], i50 = pr.central.anyos.indexOf(2050);
  const v2050 = D.escenarios.map(e => ({ e, v: pr[e.codigo_escenario].valores[i50] })).sort((a, b) => b.v - a.v);
  const min = v2050[v2050.length - 1].v, max = v2050[0].v, u = ultimo(S.ind);
  const titulo = `${nombre}: en 2050, entre ${fmt(min, d)} y ${fmt(max, d)} en los 8 escenarios oficiales del INE`;
  const radios = Object.entries(IND_ESC).map(([k, [n]]) => `<label><input type="radio" name="ind" id="ind-${k}" value="${k}" ${k === S.ind ? "checked" : ""}> ${esc(n)}</label>`).join("");
  const html = `<div class="banner"><b>ⓘ Escenarios demográficos condicionales del INE (2026-2076).</b> No son previsiones ni escenarios fiscales: no se proyectan empleo, cotizaciones, PIB ni gasto. Línea continua: observado · discontinua: base · punteadas: optimista y pesimista.</div>
    <div class="g-esc">
      <div class="stack">
        <div class="box"><h3 style="font-size:16px;margin-bottom:10px">Indicador</h3><div class="radio" id="selector">${radios}</div></div>
        <div class="box kpi"><span class="lbl">Último dato observado</span><div class="val">${fmt(u.v, d)}${suf}</div><div class="sub">${esc(nombre)} · ${u.y} · INE</div></div>
        <div class="box lectura"><b>Lectura:</b> la distancia entre las líneas punteadas es el rango que el INE asocia a distintas hipótesis de fecundidad y migración. No es un intervalo de probabilidad.</div>
      </div>
      ${panel("proyeccion", titulo, "Observado 2000-2025 y Proyecciones de Población INE 2026-2076", "tall")}
      ${panel("barras2050", "Valor en 2050 en los 8 escenarios del INE", "Incluye los 5 escenarios de sensibilidad · entre paréntesis, el papel del escenario en el KR 3.1", "tall")}
    </div>`;
  const dibujar = () => {
    document.querySelectorAll('#selector input').forEach(el => el.addEventListener("change", () => { S.ind = el.value; guardar(); render(); }));
    const obs = YEARS.filter(y => y >= 2000 && valor(S.ind, y) != null);
    const fut = pr.central.anyos, etiquetasX = [...obs, ...fut];
    const ultimoObs = valor(S.ind, obs[obs.length - 1]);
    const conecta = codigo => [...obs.slice(0, -1).map(() => null), ultimoObs, ...pr[codigo].valores];
    const codigoRol = rol => D.escenarios.find(e => e.escenario_kr === rol).codigo_escenario;
    crear("proyeccion", { type: "line", data: { labels: etiquetasX, datasets: [
        linea("Observado", [...obs.map(y => valor(S.ind, y)), ...fut.map(() => null)], tk("observed"), { ancho: 3 }),
        linea("Escenario base", conecta(codigoRol("base")), tk("observed"), { dash: [8, 5], ancho: 2 }),
        linea("Escenario optimista", conecta(codigoRol("optimista")), tk("third"), { dash: [2, 3], ancho: 2 }),
        linea("Escenario pesimista", conecta(codigoRol("pesimista")), tk("compare"), { dash: [2, 3], ancho: 2 })] },
      options: opciones({ tooltip: v => fmt(v, d) + suf, ytick: v => fmt(v, 0) }) });
    const lbl = x => x.e.etiqueta_ine + (ROL[x.e.escenario_kr] ? ` (${ROL[x.e.escenario_kr]})` : "");
    crear("barras2050", { type: "bar", data: { labels: v2050.map(lbl), datasets: [{ label: "Valor en 2050", data: v2050.map(x => x.v),
        backgroundColor: v2050.map(x => x.e.escenario_kr === "base" ? tk("brand") : hexA(tk("observed"), .8)), borderRadius: 3, barPercentage: .75 }] },
      options: opciones({ leyenda: false, tooltip: v => fmt(v, d) + suf, extra: { indexAxis: "y",
        plugins: { legend: { display: false }, etiquetas: { on: true, color: tk("text"), fmt: v => fmt(v, d) },
                   tooltip: { backgroundColor: tk("tooltip-bg"), titleColor: tk("tooltip-text"), bodyColor: tk("tooltip-text"), callbacks: { label: c => ` Valor en 2050: ${fmt(c.parsed.x, d)}${suf}` } } },
        layout: { padding: { right: 44 } },
        scales: { x: { beginAtZero: true, grid: { color: tk("grid") }, border: { display: false }, ticks: { color: tk("text2"), maxTicksLimit: 5 } },
                  y: { grid: { display: false }, border: { color: tk("border") }, ticks: { color: tk("text2"), autoSkip: false } } } } }) });
  };
  return [html, dibujar];
};

const UNIDAD = { porcentaje: "%", hijos_por_mujer: "hijos por mujer", personas: "personas", afiliados_por_pension: "afiliados por pensión", porcentaje_pib: "% del PIB", anos: "años", eur_mes: "€/mes" };
const FUENTE = { ine: "INE", seguridad_social: "Seguridad Social", eurostat: "Eurostat" };
PAG.metodologia = () => {
  const R = D.reglas, cuenta = res => R.filter(x => x.resultado === res).length;
  const tarjetaQ = (lbl, n, ico, color) => `<div class="box kpi"><div class="kpi-top"><span class="lbl">${lbl}</span><span class="ico-circle" style="color:${color}" aria-hidden="true">${ico}</span></div><div class="val" style="color:${color}">${n}</div></div>`;
  const avisos = R.filter(x => x.resultado !== "cumple").map(x => `<tr><td>${esc(x.capa)}</td><td>${esc(x.regla)}</td><td><span class="chip" style="color:var(--${x.resultado === "falla" ? "bad" : "warning"})">${esc(x.resultado)}</span></td>
      <td><details><summary>${esc((x.detalle || "").slice(0, 70))}${(x.detalle || "").length > 70 ? "…" : ""}</summary><p>${esc(x.detalle)}</p></details></td></tr>`).join("") || `<tr><td colspan="4">Sin advertencias ni fallas.</td></tr>`;
  const dicc = D.indicadores.filter(i => i.tipo_indicador !== "metrica_base").sort((a, b) => (a.codigo_kpi || "Z").localeCompare(b.codigo_kpi || "Z")).map(i =>
    `<tr><td>${i.codigo_kpi || "Contexto"}</td><td>${esc(i.nombre_indicador)}</td><td>${esc(i.formula)}</td><td>${esc(UNIDAD[i.unidad] || "personas")}</td><td>${esc(FUENTE[i.codigo_fuente] || i.codigo_fuente)}</td><td class="num">${i.cobertura_desde ?? ""}–${i.cobertura_hasta ?? ""}</td></tr>`).join("");
  const html = `<div class="g4">${tarjetaQ("Reglas de calidad evaluadas", R.length, "▦", "var(--brand)")}${tarjetaQ("Reglas superadas", cuenta("cumple"), "✓", "var(--good)")}
      ${tarjetaQ("Advertencias", cuenta("advertencia"), "!", "var(--warning)")}${tarjetaQ("Fallas", cuenta("falla"), "✕", "var(--bad)")}</div>
    <div class="g-wide">${panel("capas", `${cuenta("cumple")} de ${R.length} reglas superadas; ${cuenta("falla")} fallas en la última ejecución`, "Última ejecución de cada capa del pipeline · una falla impide escribir la capa")}
      <div class="box panel"><h3>Advertencias y fallas activas</h3><p class="sub">Las advertencias no detienen el pipeline: señalan atípicos reales o diferencias entre fuentes para revisión humana</p>
        <div class="tbl-wrap"><table><tr><th>Capa</th><th>Regla</th><th>Resultado</th><th>Detalle</th></tr>${avisos}</table></div></div></div>
    <div class="g-wide"><div class="box panel"><h3>Diccionario de indicadores</h3><p class="sub">Fórmula, unidad, fuente y cobertura de los 8 KPIs y los indicadores de contexto</p>
        <div class="tbl-wrap"><table><tr><th>KPI</th><th>Indicador</th><th>Fórmula</th><th>Unidad</th><th>Fuente</th><th style="text-align:right">Cobertura</th></tr>${dicc}</table></div></div>
      <div class="box panel"><h3>Limitaciones</h3><ul class="lim">
        <li>KPI-07 se mide por pensión, no por pensionista; pensiones disponibles desde 2016.</li>
        <li>Ruptura del saldo migratorio en 2021.</li><li>PIB y gasto/PIB recientes son provisionales y revisables.</li>
        <li>Solo España: sin datos por comunidad autónoma.</li><li>Los escenarios del INE son demográficos, no fiscales.</li>
        <li>Las relaciones mostradas son descriptivas, no causales.</li></ul></div></div>`;
  const dibujar = () => {
    const capas = [...new Set(R.map(x => x.capa))];
    const serieRes = (res, color) => ({ label: res, data: capas.map(c => { const t = R.filter(x => x.capa === c); return t.filter(x => x.resultado === res).length / t.length * 100; }),
      backgroundColor: color, borderColor: tk("surface"), borderWidth: 1, stack: "q" });
    crear("capas", { type: "bar", data: { labels: capas, datasets: [serieRes("cumple", tk("good")), serieRes("advertencia", tk("warning")), serieRes("falla", tk("bad"))] },
      options: opciones({ tooltip: v => fmt(v, 0) + " %", extra: { indexAxis: "y",
        scales: { x: { stacked: true, max: 100, grid: { color: tk("grid") }, border: { display: false }, ticks: { color: tk("text2"), callback: v => v + " %" } },
                  y: { stacked: true, grid: { display: false }, border: { color: tk("border") }, ticks: { color: tk("text2"), autoSkip: false } } } } }) });
  };
  return [html, dibujar];
};
PAG.hallazgos = () => {
  const pr = D.proyecciones.tasa_dependencia_mayores, i50 = pr.central.anyos.indexOf(2050), v = Object.values(pr).map(x => x.valores[i50]);
  const R = D.reglas, ok = R.filter(x => x.resultado === "cumple").length, adv = R.filter(x => x.resultado === "advertencia").length, fal = R.filter(x => x.resultado === "falla").length;
  const items = [
    ["Presión demográfica", T.dependencia(TODO), "demografia"],
    ["Presión demográfica", T.estructura(TODO), "demografia"],
    ["Presión demográfica", T.fecundidad(TODO), "demografia"],
    ["Presión demográfica", `${T.vegetativo(TODO)}. ${T.migratorio(TODO)}`, "demografia"],
    ["Equilibrio contributivo", T.indice(TODO), "contributivo"],
    ["Equilibrio contributivo", T.ev65(TODO), "contributivo"],
    ["Esfuerzo financiero", T.gasto(TODO), "financiero"],
    ["Esfuerzo financiero", T.indiceFin(TODO), "financiero"],
    ["Horizonte 2050", `En 2050 la dependencia de mayores estará entre ${fmt(Math.min(...v), 1)} % y ${fmt(Math.max(...v), 1)} % en los 8 escenarios del INE, frente a ${fmt(ultimo("tasa_dependencia_mayores").v, 1)} % hoy`, "escenarios"],
    ["Calidad del dato", `${R.length} reglas de calidad evaluadas: ${ok} superadas, ${adv} advertencias y ${fal} fallas en la última ejecución`, "metodologia"],
  ];
  const html = `<div class="hallazgos">${items.map(([tag, txt, pag]) => `<div class="box hz"><span class="tag">${esc(tag)}</span><p>${esc(txt)}</p>
      <button type="button" data-ir="${pag}">Ver en ${esc(PAGINAS.find(p => p.id === pag).nombre)} →</button></div>`).join("")}</div>`;
  const dibujar = () => document.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", () => ir(b.dataset.ir)));
  return [html, dibujar];
};

// ── Navegación y render ───────────────────────────────────────────────────
const nav = document.getElementById("nav");
nav.innerHTML = PAGINAS.map(p => `<button type="button" id="nav-${p.id}" data-p="${p.id}"><span class="ico" aria-hidden="true">${p.ico}</span>${esc(p.nombre)}</button>`).join("");
nav.addEventListener("click", e => { const b = e.target.closest("button"); if (b) ir(b.dataset.p); });
function ir(id) { S.pagina = id; guardar(); try { history.replaceState(null, "", "#" + id); } catch (e) {} render(); window.scrollTo({ top: 0, behavior: REDUCIR ? "auto" : "smooth" }); }

const selDesde = document.getElementById("desde"), selHasta = document.getElementById("hasta");
const opcionesAnyo = YEARS.map(y => `<option value="${y}">${y}</option>`).join("");
selDesde.innerHTML = opcionesAnyo; selHasta.innerHTML = opcionesAnyo;
function cambioPeriodo() {
  let a = +selDesde.value, b = +selHasta.value; if (a > b) [a, b] = [b, a];
  S.desde = a; S.hasta = b; guardar(); render();
}
selDesde.addEventListener("change", cambioPeriodo); selHasta.addEventListener("change", cambioPeriodo);

document.getElementById("ultimo-anyo").textContent = ULTIMO;
document.getElementById("pie").textContent = `Notas: 2020 es una anomalía (COVID-19) · el saldo migratorio tiene ruptura de serie en 2021 · PIB y gasto/PIB recientes son provisionales · KPI-07 se mide por pensión, no por pensionista · los escenarios del INE son demográficos, no fiscales. Datos: capa de carga del pipeline ETL (generada ${D.generado} UTC).`;

function render() {
  graficos.forEach(g => g.destroy()); graficos = [];
  if (window.Chart) { Chart.defaults.font.family = tk("font"); Chart.defaults.color = tk("text2"); }
  const p = PAGINAS.find(x => x.id === S.pagina);
  document.querySelectorAll("#nav button").forEach(b => b.removeAttribute("aria-current"));
  document.getElementById(`nav-${p.id}`).setAttribute("aria-current", "page");
  document.getElementById("titulo").textContent = p.titulo;
  document.getElementById("pregunta").textContent = p.pregunta;
  document.getElementById("periodo").hidden = !p.periodo;
  selDesde.value = S.desde; selHasta.value = S.hasta;
  const [html, dibujar] = PAG[p.id]();
  document.getElementById("pagina").innerHTML = html;
  dibujar();
}
if (window.Chart) Chart.register(etiquetas);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if (PAGINAS.some(p => p.id === h) && h !== S.pagina) { S.pagina = h; render(); } });
render();
})();
</script>
