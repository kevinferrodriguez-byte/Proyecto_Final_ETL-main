    csv_dir: csv
    postgresql_dir: postgresql
    postgresql_schema: pensiones

# ════════════════════════════════════════════════════════════════════════════
# PROGRAMACIÓN (python programar.py · librería schedule)
# ════════════════════════════════════════════════════════════════════════════
programacion:
    # diaria | semanal | cada_minutos | cada_segundos (las dos últimas, para pruebas y demostraciones)
    frecuencia: semanal
    dia: lunes           # solo para la frecuencia semanal
    hora: '06:00'        # hora local del equipo (diaria y semanal)
    intervalo: 60        # minutos o segundos (cada_minutos / cada_segundos)
    desde: bronce        # etapas que ejecuta cada trabajo
    hasta: carga
    registro: logs/programacion.jsonl

